html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;color:var(--text);font-family:var(--serif);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%;
  min-height:100vh;background-color:var(--wall);background-image:radial-gradient(ellipse 130% 900px at 50% 0%,rgba(255,184,100,.15),transparent 70%),var(--damask);background-repeat:no-repeat,repeat}

:focus-visible{outline:2px solid var(--brass-hi);outline-offset:2px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header: walnut with dentil trim */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--grain-h),linear-gradient(var(--walnut-mid),var(--walnut) 55%,var(--walnut-dark));box-shadow:0 8px 16px rgba(0,0,0,.55)}
.top::after{content:"";display:block;height:8px;border-top:2px solid var(--walnut-edge);
  background:repeating-linear-gradient(90deg,var(--walnut-hi) 0 8px,var(--walnut-dark) 8px 9px,var(--back) 9px 12px,var(--walnut-dark) 12px 13px)}
.top-in{max-width:1100px;margin:0 auto;padding:10px 14px 10px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.top h1{margin:0;font-family:var(--display);font-weight:400;font-size:30px;line-height:1.1;color:var(--brass-hi);text-shadow:0 1px 0 rgba(0,0,0,.85),0 0 18px rgba(235,208,142,.15);white-space:nowrap}
.offline{font-size:13px;padding:1px 8px;border-radius:2px;background:var(--leather);border:1px solid var(--brass-lo);color:var(--brass-hi);font-style:italic}

.top-actions{display:flex;gap:8px;align-items:center}
.tools{display:flex;gap:8px;margin-top:9px}

.tools input{flex:1;min-width:0}
input,select,textarea{font:inherit;font-size:17px;color:var(--text);background:var(--field);border:1px solid var(--brass-lo);border-radius:3px;padding:8px 11px;width:100%;box-shadow:inset 0 2px 4px rgba(0,0,0,.45)}

select{width:auto}
textarea{min-height:120px;resize:vertical;line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:16px;padding:7px 15px;border-radius:3px;cursor:pointer;color:var(--text);
  background:linear-gradient(var(--leather-2),var(--leather));border:1px solid var(--brass-lo);box-shadow:inset 0 1px 0 rgba(255,230,190,.08),0 1px 2px rgba(0,0,0,.4)}
.btn:disabled{opacity:.55;cursor:default}
.btn.brass{background:linear-gradient(var(--brass-hi),var(--brass) 52%,var(--brass-lo));color:var(--brass-ink);border-color:#5A4318;text-shadow:0 1px 0 rgba(255,240,200,.45);box-shadow:inset 0 1px 0 rgba(255,250,225,.6),0 1px 3px rgba(0,0,0,.55)}
.btn.wide{width:100%;padding:11px}
.btn.quiet{background:none;border-color:transparent;box-shadow:none}
.btn.small{font-size:15px;padding:5px 11px}
.icon-btn{width:40px;height:38px;border-radius:3px;border:1px solid var(--brass-lo);background:linear-gradient(var(--leather-2),var(--leather));color:var(--brass-hi);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.danger-text{color:var(--danger)}

main{max-width:1100px;margin:0 auto;padding:2px 0 104px}
.muted{color:var(--text-2)}
.count{margin:16px 18px 0;color:var(--text-2);font-style:italic;font-size:16px}

/* ---- the bookcase ---- */
.case{position:relative;margin:30px 12px 34px;padding:0 18px 0;border-radius:2px;
  background:var(--grain-v),linear-gradient(90deg,var(--walnut-dark),var(--walnut) 7%,var(--walnut-mid) 50%,var(--walnut) 93%,var(--walnut-dark));
  box-shadow:0 22px 30px -10px rgba(0,0,0,.75),0 0 0 1px rgba(0,0,0,.6)}
.case::before,.case::after{content:"";position:absolute;top:62px;bottom:20px;width:11px;border-radius:2px;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.5) 0 1px,rgba(255,220,170,.13) 1px 2px,transparent 2px 4px)}
.case::before{left:3px}.case::after{right:3px}
.cornice{margin:0 -22px;position:relative}
.cornice .cap{height:9px;border-radius:3px 3px 0 0;background:var(--grain-h),linear-gradient(var(--walnut-edge),var(--walnut-hi) 45%,var(--walnut));box-shadow:0 1px 0 rgba(0,0,0,.65)}
.cornice .cove{height:14px;margin:0 4px;background:var(--grain-h),linear-gradient(var(--walnut-dark),var(--walnut-mid) 70%,var(--walnut-hi))}
.cornice .dentil{height:10px;margin:0 8px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.45);
  background:repeating-linear-gradient(90deg,var(--walnut-hi) 0 9px,var(--walnut-dark) 9px 10px,var(--back) 10px 14px,var(--walnut-dark) 14px 15px)}

.plate-row{display:flex;justify-content:center;align-items:center;margin:8px 0 10px;position:relative;z-index:1}
.scroll{width:38px;height:24px;color:var(--brass);flex:none;filter:drop-shadow(0 1px 0 rgba(0,0,0,.7))}
.scroll.r{transform:scaleX(-1)}
.plate{position:relative;background:linear-gradient(180deg,var(--brass-hi),var(--brass) 45%,var(--brass-lo));color:var(--brass-ink);font-family:var(--display);font-size:18px;line-height:1.2;
  padding:4px 22px 5px;border-radius:2px;max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 0 rgba(255,240,200,.5);
  box-shadow:inset 0 0 0 1px rgba(255,240,200,.55),inset 0 0 0 3px rgba(0,0,0,.16),0 2px 4px rgba(0,0,0,.65)}
.plate::before,.plate::after{content:"";position:absolute;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--brass-hi),var(--brass-lo) 70%);box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.plate::before{left:7px}.plate::after{right:7px}
.plate small{font-family:var(--serif);font-size:14px;margin-left:7px;opacity:.75}
.shelf{display:flex;flex-wrap:wrap;align-items:flex-end;padding:0 6px;min-height:166px;border-radius:1px;box-shadow:inset 0 0 0 2px var(--walnut-dark),inset 0 0 18px rgba(0,0,0,.6);
  background:
    var(--grain-h),
    repeating-linear-gradient(to bottom,rgba(0,0,0,.6) 0,rgba(0,0,0,0) 28px,transparent 166px),
    repeating-linear-gradient(to bottom,transparent 0 149px,rgba(0,0,0,.75) 149px 150px,var(--walnut-edge) 150px 151px,var(--walnut-hi) 151px 154px,var(--walnut-mid) 154px 158px,var(--walnut) 158px 162px,var(--walnut-dark) 162px 164px,rgba(0,0,0,.85) 164px 166px),
    linear-gradient(90deg,rgba(0,0,0,.55),transparent 14%,transparent 86%,rgba(0,0,0,.55)),
    var(--back)}
.shelf.blank{min-height:332px}
.plinth{height:22px;margin:0 -22px;border-radius:0 0 3px 3px;
  background:var(--grain-h),linear-gradient(var(--walnut-dark) 0 2px,var(--walnut-hi) 2px 5px,var(--walnut-mid) 5px 9px,var(--walnut) 9px 17px,var(--walnut-edge) 17px 18px,var(--walnut-dark) 18px)}
.slot{height:166px;padding-bottom:16px;display:flex;align-items:flex-end}
.spine{position:relative;height:var(--h);width:var(--w);color:var(--t);border:0;border-radius:2px 2px 1px 1px;padding:10px 0;margin-right:1px;
  background:linear-gradient(90deg,rgba(0,0,0,.45),rgba(255,235,200,.11) 28%,rgba(255,235,200,.03) 56%,rgba(0,0,0,.48)),var(--c);
  writing-mode:vertical-rl;display:flex;align-items:center;justify-content:flex-start;overflow:hidden;cursor:pointer;
  font-family:var(--serif);font-weight:600;font-size:13px;letter-spacing:.02em;line-height:1.1;box-shadow:1px 0 0 rgba(0,0,0,.55),0 -1px 0 rgba(255,230,190,.08)}
.spine span{max-height:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spine.banded::after{content:"";position:absolute;left:0;right:0;top:11px;height:2px;background:var(--t);opacity:.5}
.spine.bound{padding:28px 0;color:var(--gilt)}
.spine.bound::before,.spine.bound::after{content:"";position:absolute;left:0;right:0;height:14px;opacity:1;
  background:linear-gradient(to bottom,var(--gilt) 0 1px,transparent 1px 3px,rgba(0,0,0,.5) 3px 4px,rgba(255,235,200,.24) 4px 7px,rgba(0,0,0,.5) 7px 8px,transparent 8px 10px,var(--gilt) 10px 11px,transparent 11px)}
.spine.bound::before{top:8px}.spine.bound::after{bottom:8px;top:auto}
.spine.pending{outline:1px dashed var(--t);outline-offset:-4px}
.spine:hover{filter:brightness(1.12)}
.empty-card{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);width:min(86%,380px);z-index:2}
.empty-note{margin:28px 18px;color:var(--text-2);font-style:italic}

/* parchment */
.parch{background:radial-gradient(ellipse at center,var(--parch) 55%,#D7C599);color:var(--parch-ink);border-radius:2px;box-shadow:0 6px 16px rgba(0,0,0,.5),inset 0 0 24px rgba(130,90,40,.28)}

/* leather panels with tooled gilt frame */
.leather{background:var(--pebble),linear-gradient(var(--leather-2),var(--leather));
  box-shadow:inset 0 0 0 5px var(--leather),inset 0 0 0 6px rgba(196,154,69,.55),inset 0 0 0 9px var(--leather),inset 0 0 0 10px rgba(196,154,69,.25),0 8px 18px rgba(0,0,0,.45)}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:14px 12px 0;padding:14px 18px;border-radius:3px;font-size:16px}
.banner-btns{display:flex;gap:6px;flex-wrap:wrap}
.bar{height:4px;background:rgba(0,0,0,.45);border-radius:2px;margin-top:7px;overflow:hidden}
.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--brass-lo),var(--brass-hi))}

.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:18px 14px 6px}
.section-head p{margin:0;color:var(--text-2);font-style:italic}
.chip{border:1px solid var(--brass-lo);background:var(--leather);border-radius:999px;padding:5px 13px;font-size:15px;cursor:pointer}
.chip[aria-pressed="true"]{background:linear-gradient(var(--brass-hi),var(--brass));color:var(--brass-ink);border-color:#5A4318}
.ledger{margin:12px;border-radius:4px}
.card-head{display:block;width:100%;text-align:left;background:none;border:0;padding:18px 20px 14px;cursor:pointer}
.card-title{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.2;margin:0}
.ledger .card-title{color:var(--brass-hi)}
.card-sub{color:var(--text-2);font-size:15px;margin:2px 0 0;font-style:italic}
.progress-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:10px}
.pips{display:flex;gap:2px;align-items:flex-end;flex-wrap:wrap}
.pip{width:9px;height:26px;border-radius:1px;box-shadow:inset 1px 0 0 rgba(255,255,255,.15),inset -1px 0 0 rgba(0,0,0,.35)}
.pip.miss{border:1.5px dashed var(--brass);opacity:.65;box-shadow:none}
.tag{display:inline-block;font-size:14px;font-weight:600;padding:1px 10px;border-radius:2px;white-space:nowrap}
.tag.gap{background:linear-gradient(var(--brass-hi),var(--brass));color:var(--brass-ink)}
.tag.full{color:var(--ok);border:1px solid currentColor}
.tag.soft{color:var(--text-2);border:1px solid var(--line);font-weight:500}
.tag.warn{color:var(--danger);border:1px solid currentColor;font-weight:500}
.card-body{padding:2px 20px 18px}
.ledger .card-body{border-top:1px solid rgba(196,154,69,.35);margin:0 10px;padding:4px 10px 18px}
.entry{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dotted rgba(196,154,69,.4)}
.entry:last-of-type{border-bottom:0}
.entry .num{font-family:var(--display);color:var(--brass);text-align:right;font-size:18px}
.entry .et{font-size:17px;line-height:1.25}
.entry .ey{color:var(--text-2);font-size:14px}
.entry.missing .et{color:var(--text-2);font-style:italic}
.entry .owned{font-size:14px;color:var(--ok);font-style:italic}
.entry button.link{background:none;border:0;padding:0;text-align:left;cursor:pointer;font:inherit;color:inherit}
.card-foot{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

/* index cards for lists */
.index-card{margin:14px 12px;border-radius:2px;color:var(--parch-ink);
  background:repeating-linear-gradient(to bottom,transparent 0 27px,var(--ruled) 27px 28px) 0 64px/100% calc(100% - 64px) no-repeat,radial-gradient(ellipse at center,var(--parch) 60%,#DCCB9F);
  box-shadow:0 8px 18px rgba(0,0,0,.5),inset 0 0 22px rgba(130,90,40,.22)}
.index-card .card-head{border-bottom:2px solid var(--rule);color:var(--parch-ink);padding-bottom:10px}
.index-card .card-sub{color:var(--parch-ink-2)}
.index-card .btn{background:transparent;color:var(--parch-ink);border-color:var(--parch-ink-2);box-shadow:none}
.index-card .btn.danger-text{color:var(--rule)}
.index-card .btn.quiet{border-color:transparent}
.item{padding:10px 0;border-bottom:1px solid rgba(43,30,18,.12)}
.item:last-of-type{border-bottom:0}
.item .it{font-size:18px;font-weight:600;line-height:1.25}
.item .ia{font-size:15px;color:var(--parch-ink-2);font-style:italic}
.item .in{font-size:15px;margin-top:3px}
.item .ib{display:flex;gap:6px;margin-top:7px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-bottom:env(safe-area-inset-bottom,0px);border-top:2px solid var(--walnut-edge);
  background:var(--grain-h),linear-gradient(var(--walnut),var(--walnut-dark));box-shadow:0 -6px 14px rgba(0,0,0,.5)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.nav button{position:relative;background:none;border:0;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:14px;font-weight:600;color:var(--text-2);cursor:pointer}
.nav button[aria-current="page"]{color:var(--brass-hi)}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:-2px;left:28%;right:28%;height:3px;background:linear-gradient(90deg,var(--brass-lo),var(--brass-hi),var(--brass-lo))}
.badge{position:absolute;top:4px;left:calc(50% + 9px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--brass);color:var(--brass-ink);font-size:12px;line-height:18px}
.badge[hidden]{display:none}

/* sheets */
.backdrop{position:fixed;inset:0;background:var(--scrim);z-index:40}

  border-radius:10px 10px 0 0;padding:10px 22px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .24s ease-out}

.grab{width:40px;height:4px;border-radius:2px;background:var(--brass-lo);margin:4px auto 6px}

.sub{font-size:17px;margin:20px 0 8px;font-weight:600}
.field{margin-bottom:10px}
.field label{display:block;font-size:15px;font-weight:600;margin-bottom:4px}
.opt{font-weight:400;color:var(--text-2);font-style:italic}
.photo-pick{display:block;border:1px dashed var(--brass);border-radius:3px;padding:20px 16px;text-align:center;cursor:pointer;background:var(--pebble),var(--baize);box-shadow:inset 0 0 20px rgba(0,0,0,.5)}
.pp-main{display:block;font-family:var(--display);font-size:21px;color:var(--brass-hi)}
.pp-hint{display:block;color:var(--text-2);font-size:15px;margin-top:3px;font-style:italic}
.progress-line{font-family:var(--display);font-size:20px;margin:4px 0 8px}
.bookhead{display:flex;gap:16px;align-items:flex-start;margin-top:4px}
.cover{flex:none;width:72px;height:108px;border-radius:2px 4px 4px 2px;color:var(--t);font-weight:600;font-size:12px;line-height:1.2;padding:9px 6px 8px 11px;overflow:hidden;
  background:linear-gradient(90deg,rgba(0,0,0,.45) 0 5px,rgba(255,235,200,.1) 5px 7px,transparent 30%),var(--c);box-shadow:0 3px 8px rgba(0,0,0,.6)}
.b-title{font-family:var(--display);font-weight:400;font-size:25px;line-height:1.15;margin:0 40px 4px 0;color:var(--brass-hi)}
.b-author{margin:0;font-size:18px;font-style:italic}
.b-meta{margin:6px 0 0;display:flex;gap:6px;flex-wrap:wrap}
.series-link{display:block;margin:14px 0 0;background:none;border:0;padding:0;font-weight:600;text-decoration:underline;text-decoration-color:var(--brass);text-underline-offset:3px;cursor:pointer;text-align:left}
.blurb{font-size:18px;line-height:1.6;margin:16px 0 0;padding:14px 18px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.cand{display:grid;grid-template-columns:auto 14px 1fr;gap:10px;align-items:start;padding:10px 0;border-bottom:1px dotted rgba(196,154,69,.35)}
.cand input[type=checkbox]{width:22px;height:22px;margin:8px 0 0;accent-color:var(--brass);box-shadow:none}
.swatch{width:14px;height:44px;border-radius:2px;margin-top:4px;box-shadow:inset 2px 0 0 rgba(255,255,255,.15),inset -2px 0 0 rgba(0,0,0,.35)}

.list-section{margin:14px 0 2px;font-family:var(--display);font-size:19px;color:var(--rule)}
.index-card .tag.kindtag{color:var(--parch-ink-2);border:1px solid rgba(43,30,18,.3);font-weight:500;font-size:12px;vertical-align:2px}

@media (min-width:700px){.top h1{font-size:34px}.case{margin:34px 24px 40px}}

</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="top-row">
      <div class="brand"><h1>The Study</h1><span class="offline" id="offline" hidden>offline</span></div>
      <div class="top-actions">
        <button class="icon-btn" id="menuBtn" aria-label="Settings and backup">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
        </button>
        <button class="btn brass" id="addBtn">Add books</button>
      </div>
    </div>
    <div class="tools" id="shelfTools">
      <input type="search" id="q" placeholder="Search titles, authors, translators" aria-label="Search your library" autocomplete="off">
      <select id="group" aria-label="Arrange shelves">

<script>
"use strict";
const GENRES=["Fantasy","Science fiction","Mystery & thriller","Horror","Romance","Literary fiction","Historical fiction","Young adult","Children’s","Classics","Graphic novels & comics","Poetry","Biography & memoir","History","Science & nature","Business & money","Self-help","Philosophy & religion","Politics & society","Cooking","Arts & music","Reference","Other nonfiction"];
const PALETTE=["#6E2420","#243E5C","#2F4B2D","#8E6A2C","#4A3157","#2A221C","#7D4422","#2D5752","#B9AE92","#5A1A2C","#1C3148","#6D6A2C"];
const WISHLIST="Wishlist",PICKS="Suggested by Claude";
const CORNICE=`<div class="cornice" aria-hidden="true"><div class="cap"></div><div class="cove"></div><div class="dentil"></div><div class="bead"></div></div>`;
const SCROLL=c=>`<svg class="scroll${c}" viewBox="0 0 40 24" aria-hidden="true"><path d="M39 12H25C19 12 15 4 9 5 4 6 3 12 7 14c3 1.5 5-1.5 3-3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M25 12c-4 0-6 7-12 7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".7"/><circle cx="31" cy="12" r="1.6" fill="currentColor"/></svg>`;

const S={records:new Map(),queued:[],tab:"shelves",group:"genre",q:"",gapsOnly:false,openSeries:new Set(),openLists:new Set(),
  persist:true,persisted:false,savedPhotos:0,translating:false,
  queue:new Set(),jobRunning:false,jobDone:0,jobTotal:0,suggesting:false,busySeries:new Set(),confirmDel:null,loaded:false,photoCtl:null};

/* ---------- helpers ---------- */
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=p=>p+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const clone=o=>JSON.parse(JSON.stringify(o));
const norm=s=>String(s||"").toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim().replace(/^(the|a|an) /,"");
const slug=s=>(norm(s).replace(/ /g,"-").slice(0,80))||"x";
const cleanStr=(s,max=300)=>typeof s==="string"?s.trim().slice(0,max):"";
const hex=c=>typeof c==="string"&&/^#[0-9a-fA-F]{6}$/.test(c.trim())?c.trim():null;
const lastName=a=>norm(a).split(" ").pop()||"";
const canAsk=()=>!!AI.key()&&navigator.onLine!==false;
const canRead=()=>canAsk();
function hash(s){let h=2166136261;for(const ch of String(s)){h^=ch.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function lum(h){const n=parseInt(h.slice(1),16);const ch=[n>>16&255,n>>8&255,n&255].map(v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4)});return .2126*ch[0]+.7152*ch[1]+.0722*ch[2];}
function ratio(a,b){const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);}
function colors(b){const h=hash(b.id);const c=hex(b.color)||PALETTE[h%PALETTE.length];let t=hex(b.textColor);if(!t||ratio(c,t)<3)t=lum(c)>.3?"#1E1A14":"#F1E8D2";return{c,t};}
function genreOf(g){if(!g)return null;const n=norm(g);return GENRES.find(x=>norm(x)===n)||null;}
function num(v){const n=parseFloat(v);return Number.isFinite(n)?n:null;}
function titleMatch(a,b){const x=norm(a),y=norm(b);return !!x&&(x===y||(x.length>5&&y.length>5&&(x.startsWith(y+" ")||y.startsWith(x+" "))));}
const live=kind=>[...S.records.values()].filter(r=>r.kind===kind&&!r.deleted);
const plural=(n,w,p)=>`${n} ${n===1?w:(p||w+"s")}`;
function parseLines(text){
  return String(text||"").split(/\n+/).map(l=>l.trim().replace(/^[-*•\d.)\s]+(?=\S)/,"")).filter(Boolean).map(l=>{
    const m=l.match(/^(.+)\s(?:by|—|–|-)\s(.+)$/i);return m?{title:m[1].trim(),author:m[2].trim()}:{title:l,author:""};});
}
let toastTimer;
function toast(msg){if(!msg)return;const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,3800);}
const toDataURL=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b);});

/* ---------- on-device storage (IndexedDB) ---------- */
const store={
  db:null,
  async open(){try{this.db=await new Promise((res,rej)=>{const r=indexedDB.open("shelves-library",2);
    r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains("records"))d.createObjectStore("records",{keyPath:"id"});if(!d.objectStoreNames.contains("photos"))d.createObjectStore("photos",{keyPath:"id"});};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}catch(e){this.db=null;S.persist=false;}},
  async all(name="records"){if(!this.db)return[];try{return await new Promise((res,rej)=>{const q=this.db.transaction(name).objectStore(name).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error);});}catch(e){return[];}},
  async put(recs,name="records"){if(!this.db||!recs.length)return true;try{await new Promise((res,rej)=>{const tx=this.db.transaction(name,"readwrite");const os=tx.objectStore(name);for(const r of recs)os.put(r);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error);});return true;}catch(e){return false;}},
  async del(ids,name="records"){if(!this.db||!ids.length)return;try{await new Promise((res,rej)=>{const tx=this.db.transaction(name,"readwrite");const os=tx.objectStore(name);for(const i of ids)os.delete(i);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}catch(e){}}
};
async function save(recs){
  recs=[].concat(recs);const now=Date.now();
  for(const r of recs){r.updatedAt=Math.max(now,(r.updatedAt||0)+1);S.records.set(r.id,r);}
  await store.put(recs);scheduleRender();pushDirty();
}

/* ---------- cloud backup (db) ---------- */
function pushDirty(){}
function syncText(){
  if(!S.persist)return"This browser isn’t keeping your library between visits. Save a backup file before you close the app.";
  return S.persisted?"Your library lives on this phone, and the phone has agreed not to clear it to free up space. Save a backup file now and then anyway.":"Your library lives on this phone only. Save a backup file now and then so a phone reset can’t take it.";
}
/* ---------- Claude ---------- */
const MODELS={smart:"claude-sonnet-5-5",cheap:"claude-haiku-5-5"};
const PRICES={"claude-sonnet-5-5":[2,10],"claude-haiku-5-5":[0.10,0.50]};
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}},del(k){try{localStorage.removeItem(k);}catch(e){}}};
function spend(){try{return JSON.parse(LS.get("study-spend","{}"))||{};}catch(e){return{};}}
function track(model,u){if(!u)return;const p=PRICES[model]||[2,10];const s=spend();s.cost=(s.cost||0)+(u.input_tokens||0)*p[0]/1e6+(u.output_tokens||0)*p[1]/1e6;s.calls=(s.calls||0)+1;LS.set("study-spend",JSON.stringify(s));}
const toB64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=()=>rej(r.error);r.readAsDataURL(b);});
function parseJSON(text){
  const t=String(text||"").replace(/```(?:json)?/gi,"").trim();
  try{return JSON.parse(t);}catch(e){}
  const a=t.search(/[\[{]/),b=Math.max(t.lastIndexOf("}"),t.lastIndexOf("]"));
  if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1));}catch(e){}}
  throw{code:"invalid_json"};
}
const AI={
  key(){return LS.get("study-api-key","");},
  model(){return LS.get("study-economy","0")==="1"?MODELS.cheap:MODELS.smart;},
  async json(prompt,opts={}){
    const key=this.key();if(!key)throw{code:"no_key"};
    if(navigator.onLine===false)throw{code:"offline"};
    const model=opts.model||this.model();
    const content=[];
    for(const b of opts.images||[])content.push({type:"image",source:{type:"base64",media_type:"image/jpeg",data:await toB64(b)}});
    content.push({type:"text",text:prompt+"\n\nRespond with the JSON only, with no other text."});
    let res;
    try{res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",signal:opts.signal,
      headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model,max_tokens:opts.maxTokens||8000,messages:[{role:"user",content}]})});}
    catch(e){if(e&&e.name==="AbortError")throw{code:"cancelled"};throw{code:navigator.onLine===false?"offline":"network"};}
    let data=null;try{data=await res.json();}catch(e){}
    if(!res.ok){
      const msg=(data&&data.error&&data.error.message)||"";
      if(res.status===401||res.status===403)throw{code:"bad_key"};
      if(res.status===429)throw{code:"rate_limited"};
      if(res.status===400&&/credit|billing|balance/i.test(msg))throw{code:"no_credit"};
      if(res.status===413||/too large|too long/i.test(msg))throw{code:"prompt_too_large"};
      if(res.status===529||res.status>=500)throw{code:"overloaded"};
      throw{code:"api_error",msg};
    }
    track(model,data&&data.usage);
    if(data&&data.stop_reason==="refusal")throw{code:"refused"};
    return parseJSON((data.content||[]).filter(x=>x.type==="text").map(x=>x.text).join(""));
  }
};
const STOPS=["no_key","bad_key","no_credit","rate_limited","offline","network"];
function sampleMsg(e){
  const c=e&&e.code;
  return({cancelled:"",no_key:"Add your Anthropic API key in Settings (the ⋯ button) so Claude can read photos.",
    bad_key:"Your API key was rejected. Check it in Settings.",no_credit:"Your Anthropic account is out of credit. Add some in the Claude Console.",
    rate_limited:"Too many requests at once. Wait a minute and try again.",offline:"You’re offline. Photos are saved and can be read once you’re back online.",
    network:"Couldn’t reach Claude. Check your connection and try again.",overloaded:"Claude is overloaded right now. Try again in a few minutes.",
    image_rejected:"That photo couldn’t be opened. Try taking it again.",refused:"Claude couldn’t read that photo. Try a different one.",
    invalid_json:"Claude’s answer came back garbled. Try again.",prompt_too_large:"That photo was too large to send. Try a closer, smaller shot."})[c]??`Claude returned an error${e&&e.msg?`: ${e.msg}`:""}.`;
}
const stopsRun=e=>STOPS.includes(e&&e.code);
function identifyPrompt(parts){
  return `You are cataloguing a person's home library from a photo of their books.
${parts>1?"The images are overlapping sections of ONE photo (left/right or top/bottom). A book visible in both sections counts once.":"The image is one photo of a shelf or a stack of books."}
List every book whose title you can actually read on its spine or cover. Use your knowledge to complete a partly visible title or an author's full name, but never invent books you cannot see. Ignore objects that aren't books. A boxed set counts as one entry.
Reply with only JSON in this shape:
{"books":[{"title":"Full Title","author":"Author Name","translator":null,"publisher":null,"color":"#RRGGBB","textColor":"#RRGGBB","sure":true}]}
"translator" is the translator's name only when it is printed and readable on the spine or cover (for example "Pevear and Volokhonsky, translators" or "A new translation by Oliver Ready"); otherwise null. "publisher" is the imprint name or logo you can read on the spine (for example "Penguin Classics", "Vintage", "Tor"); otherwise null.
"color" is the spine's main background color as it looks in the photo; "textColor" is the color of the spine lettering. Set "sure" to false when you are guessing at hard-to-read text. Order books as they sit on the shelf.`;
}
function enrichPrompt(items){
  return `Give catalogue details for each book below, for a home-library app.
Books: ${JSON.stringify(items)}
Reply with only a JSON array, one object per book, using the same "key" values:
[{"key":"k0","title":"Correct full title","author":"Author's full name","genre":"one of: ${GENRES.join(" | ")}","year":1999,"blurb":"2-3 sentences in your own words on what the book is about. No spoilers beyond the opening premise.","color":"#RRGGBB","originalLanguage":null,"translator":null,"translatorLikely":false,"series":null}]
"originalLanguage" is the language the book was first written in, or null if it was written in English. For a book first written in another language: if a translator is given in the input, repeat it; otherwise give the translator of this edition only when the publisher or edition makes it fairly clear, set "translatorLikely" to true, and use null when you can't tell.
"color" is the typical spine color of a common edition. When the book belongs to a series, "series" is {"name":"Series name","number":2,"books":[{"number":1,"title":"...","year":2001}],"complete":true}: "books" lists every main numbered entry in reading order (leave out novellas and companion books unless the series numbers them), and "complete" says whether the series has finished. If you don't recognise a book, keep its title and author as given, give your best genre guess, and set "blurb" to "".`;
}

/* ---------- books ---------- */
function newBook(it){
  return{kind:"book",id:uid("b"),title:cleanStr(it.title,200),author:cleanStr(it.author,120),genre:null,year:null,blurb:"",
    color:hex(it.color),textColor:hex(it.textColor),seriesId:null,seriesName:null,seriesNumber:null,needsDetails:true,addedAt:Date.now(),
    publisher:cleanStr(it.publisher,80)||null,translator:cleanStr(it.translator,160)||null,translatorSource:cleanStr(it.translator)?(it.translatorSource||"spine"):null,
    originalLanguage:null,photoId:it.photoId||null};
}
async function addBooks(items){
  const recs=items.filter(i=>cleanStr(i.title)).map(newBook);
  if(!recs.length)return 0;
  await save(recs);
  fillDetails(recs.map(r=>r.id));
  return recs.length;
}
function cleanSeriesBooks(list){
  if(!Array.isArray(list))return[];
  return list.map(e=>({number:num(e&&e.number),title:cleanStr(e&&e.title,200),year:num(e&&e.year)})).filter(e=>e.title).slice(0,120);
}
function applyTranslation(book,d){
  if(!d||!("originalLanguage" in d||"translator" in d))return;
  const lang=cleanStr(d.originalLanguage,40);
  book.originalLanguage=lang&&norm(lang)!=="english"?lang:null;
  book.translationChecked=true;
  const t=cleanStr(d.translator,160);
  const locked=book.translatorSource==="spine"||book.translatorSource==="photo"||book.translatorSource==="you";
  if(book.originalLanguage&&t&&!locked){book.translator=t;book.translatorSource=d.translatorLikely?"likely":"edition";}
  if(!book.originalLanguage&&!locked){book.translator=null;book.translatorSource=null;}
}
function applyDetails(book,d,seriesMap){
  book.title=cleanStr(d.title,200)||book.title;
  book.author=cleanStr(d.author,120)||book.author;
  book.genre=genreOf(d.genre)||book.genre||"Other nonfiction";
  book.year=num(d.year)??book.year;
  book.blurb=cleanStr(d.blurb,1200)||book.blurb||"";
  if(!hex(book.color))book.color=hex(d.color);
  applyTranslation(book,d);
  book.needsDetails=false;
  const s=d.series;
  if(s&&typeof s==="object"&&cleanStr(s.name)){
    const name=cleanStr(s.name,150),sid="s_"+slug(name);
    book.seriesId=sid;book.seriesName=name;book.seriesNumber=num(s.number);
    const books=cleanSeriesBooks(s.books);
    const fresh={kind:"series",id:sid,name,author:book.author,books:[],complete:null};
    let rec=seriesMap.get(sid)||(S.records.get(sid)?clone(S.records.get(sid)):fresh);
    if(rec.deleted)rec=fresh;
    if(books.length>=(rec.books||[]).length){rec.books=books;rec.complete=typeof s.complete==="boolean"?s.complete:rec.complete;}
    rec.name=rec.name||name;rec.author=rec.author||book.author;
    seriesMap.set(sid,rec);
  }
}
function fillDetails(ids){
  if(!canAsk()){if(ids.length)scheduleRender();return;}
  ids.forEach(i=>S.queue.add(i));
  S.jobTotal+=ids.length;
  runJob();
}
async function runJob(){
  if(S.jobRunning)return;
  S.jobRunning=true;scheduleRender();
  try{
    while(S.queue.size&&canAsk()){
      const batch=[...S.queue].slice(0,8);batch.forEach(i=>S.queue.delete(i));
      const books=batch.map(i=>S.records.get(i)).filter(b=>b&&!b.deleted).map(clone);
      if(!books.length)continue;
      try{
        const res=await AI.json(enrichPrompt(books.map((b,i)=>{const o={key:"k"+i,title:b.title,author:b.author||""};if(b.publisher)o.publisher=b.publisher;if(b.translator)o.translator=b.translator;return o;})));
        const arr=Array.isArray(res)?res:(Array.isArray(res&&res.books)?res.books:[]);
        const seriesMap=new Map(),out=[];
        for(const d of arr){
          if(!d||typeof d!=="object")continue;
          const b=books[parseInt(String(d.key||"").slice(1),10)];
          if(!b)continue;
          const cur=S.records.get(b.id);if(!cur||cur.deleted)continue;
          const copy=clone(cur);applyDetails(copy,d,seriesMap);out.push(copy);
        }
        if(out.length)await save([...out,...seriesMap.values()]);
      }catch(e){const m=sampleMsg(e);if(m)toast(m);if(stopsRun(e))break;}
      S.jobDone+=books.length;scheduleRender();
    }
  }finally{S.jobRunning=false;S.queue.clear();S.jobDone=0;S.jobTotal=0;scheduleRender();}
}

/* ---------- series ---------- */
function seriesView(){
  const owned=new Map();
  for(const b of live("book")){if(!b.seriesId)continue;if(!owned.has(b.seriesId))owned.set(b.seriesId,[]);owned.get(b.seriesId).push(b);}
  const out=[];
  for(const[sid,books]of owned){
    const rec=S.records.get(sid);const hasRec=rec&&!rec.deleted;
    const catalog=hasRec&&Array.isArray(rec.books)?rec.books:[];
    const used=new Set(),entries=[];
    for(const e of catalog){
      let m=books.find(b=>!used.has(b)&&b.seriesNumber!=null&&e.number!=null&&Number(b.seriesNumber)===Number(e.number));
      if(!m)m=books.find(b=>!used.has(b)&&titleMatch(b.title,e.title));
      if(m)used.add(m);
      entries.push({number:e.number,title:e.title,year:e.year,book:m||null});
    }
    for(const b of books)if(!used.has(b))entries.push({number:b.seriesNumber,title:b.title,year:b.year,book:b});
    entries.sort((a,b)=>(a.number??999)-(b.number??999));
    out.push({sid,name:(hasRec&&rec.name)||books[0].seriesName,author:(hasRec&&rec.author)||books[0].author,entries,
      missing:entries.filter(e=>!e.book),complete:hasRec?rec.complete:null,catalogued:catalog.length>0});
  }
  out.sort((a,b)=>(b.missing.length>0)-(a.missing.length>0)||a.name.localeCompare(b.name));
  return out;
}
async function refreshSeries(sid){
  if(!canAsk()){toast("Checking for newer books needs a connection to Claude.");return;}
  const sv=seriesView().find(s=>s.sid===sid);if(!sv)return;
  S.busySeries.add(sid);scheduleRender();
  try{
    const res=await AI.json(`List every main numbered entry in the book series "${sv.name}" by ${sv.author||"its author"}, in reading order, including the newest released or announced books you know of. Leave out novellas and companion books unless the series numbers them.
Reply with only JSON: {"name":"Series name","books":[{"number":1,"title":"...","year":2001}],"complete":true}
"complete" says whether the series has finished.`);
    const books=cleanSeriesBooks(res&&res.books);
    if(!books.length)throw{code:"invalid_json"};
    const cur=S.records.get(sid);
    const rec=clone(cur&&!cur.deleted?cur:{kind:"series",id:sid,name:sv.name,author:sv.author});
    const before=(rec.books||[]).length;
    rec.books=books;if(typeof res.complete==="boolean")rec.complete=res.complete;
    await save(rec);
    toast(books.length>before&&before?`Found ${plural(books.length-before,"more book")} in ${sv.name}.`:`${sv.name} is up to date.`);
  }catch(e){const m=sampleMsg(e);if(m)toast(m);}
  finally{S.busySeries.delete(sid);scheduleRender();}
}

/* ---------- lists ---------- */
function listItemsIndex(){const m=new Map();for(const l of live("list"))for(const it of l.items||[])m.set(norm(it.title),l.name);return m;}
async function addToList(name,item){
  let list=live("list").find(l=>l.name===name);
  list=list?clone(list):{kind:"list",id:uid("l"),name,items:[],createdAt:Date.now()};
  if(list.items.some(i=>norm(i.title)===norm(item.title))){toast(`Already on ${name}.`);return false;}
  list.items.push({id:uid("i"),title:cleanStr(item.title,200),author:cleanStr(item.author,120),note:cleanStr(item.note,400),addedAt:Date.now()});
  await save(list);toast(`Added to ${name}.`);return true;
}
function findItem(key){const[lid,iid]=key.split("|");const l=S.records.get(lid);if(!l||l.deleted)return{};return{list:l,item:(l.items||[]).find(i=>i.id===iid)};}
async function removeItem(key,quiet){
  const{list,item}=findItem(key);if(!item)return;
  const c=clone(list);c.items=c.items.filter(i=>i.id!==item.id);await save(c);
  if(!quiet)toast(`Removed “${item.title}”.`);
}
// Turn any pasted text into list items. Claude tidies it when online; a simple line-by-line reading works offline.
function listPrompt(text){
  return `Someone pasted this into a reading list in their library app:
"""
${text}
"""
Turn it into list items. Keep every item, in order. Do not add, merge, correct into different works, or drop items. Headings (like "Russian classics:") are not items; use them as "section" for the items under them.
Reply with only a JSON array: [{"title":"","author":null,"kind":"book","translator":null,"note":null,"section":null}]
"kind" is "series" for a series, trilogy or saga, "book" for a single book, "other" for anything else (an author, a topic). "translator" is a specific translation they asked for, if any. "note" holds anything else they wrote about the item (an edition, who recommended it, a reason). Fill in an author's full name only when you're sure of it.`;
}
function parseListOffline(text){
  const items=[];let section=null;
  for(let raw of String(text||"").split(/\n+/)){
    let l=raw.trim();if(!l)continue;
    l=l.replace(/^(?:[-*•–]|\d+[.)]|\[.?\])\s*/,"").trim();if(!l)continue;
    if(/:$/.test(l)&&l.length<60){section=l.replace(/:$/,"").trim();continue;}
    let translator=null,note=null;
    const tm=l.match(/\(?\s*(?:trans(?:lated)?\.?(?:\s+by)?|tr\.)\s+([^)\n]+?)\s*\)?$/i)||l.match(/[,(–-]\s*([A-Z][^,()–-]+?)\s+(?:translation|trans\.?)\s*\)?$/i);
    if(tm){translator=tm[1].trim();l=l.slice(0,tm.index).replace(/[,(–-]\s*$/,"").trim();}
    const nm=l.match(/\s*\(([^)]+)\)\s*$/);if(nm){note=nm[1].trim();l=l.slice(0,nm.index).trim();}
    const m=l.match(/^(.+?)\s(?:by|—|–|-)\s(.+)$/i);
    const title=(m?m[1]:l).replace(/^["“”]|["“”]$/g,"").replace(/\s+(series|saga)$/i,"").trim(),author=m?m[2].trim():null;
    items.push({title,author,kind:/\b(series|trilogy|saga|cycle|chronicles|quartet|duology)\b/i.test(raw)?"series":"book",translator,note,section,text:raw.trim()});
  }
  return items;
}
async function parseListText(text){
  if(canAsk()){
    try{const arr=await AI.json(listPrompt(text.slice(0,20000)),{maxTokens:8000});
      if(Array.isArray(arr)&&arr.length)return{items:arr,tidy:true};}catch(e){}
  }
  return{items:parseListOffline(text),tidy:false};
}
function cleanItem(it){
  const kind=["book","series","other"].includes(it&&it.kind)?it.kind:"book";
  return{id:uid("i"),title:cleanStr(it&&it.title,200),author:cleanStr(it&&it.author,120),kind,translator:cleanStr(it&&it.translator,160),
    note:cleanStr(it&&it.note,400),section:cleanStr(it&&it.section,80),addedAt:Date.now()};
}
async function addTextToList(listId,name,text){
  const{items,tidy}=await parseListText(text);
  let list=listId?S.records.get(listId):null;

    if(list.items.some(x=>norm(x.title)===norm(it.title)&&(x.kind||"book")===it.kind))continue;
    list.items.push(it);n++;}
  await save(list);S.openLists.add(list.id);
  return{n,tidy,list};
}

async function suggest(){
  const books=live("book");
  if(books.length<3){toast("Add a few books first so Claude can get a feel for your taste.");return;}
  if(!canAsk()){toast("Suggestions need a connection to Claude.");return;}
  S.suggesting=true;scheduleRender();
  try{

    const saved=[...listItemsIndex().keys()].slice(0,150).join("; ");
    const res=await AI.json(`Here are the books someone owns:
${owned}

Recommend 8 books they don't own that fit their taste: mostly strong matches, plus a couple of less obvious picks. Don't include anything from the list above, or any of these titles they've already saved: ${saved||"none"}.
Reply with only a JSON array: [{"title":"","author":"","why":"one sentence on why it fits, naming a book they own"}]`);

/* ---------- photos: reading, and the offline waiting pile ---------- */
async function decode(blob){
  try{return await createImageBitmap(blob,{imageOrientation:"from-image"});}catch(e){try{return await createImageBitmap(blob);}catch(e2){return null;}}
}
async function shrink(blob){
  const bmp=await decode(blob);if(!bmp)return blob;
  try{const sc=Math.min(1,2800/Math.max(bmp.width,bmp.height));const c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);const out=await new Promise(r=>c.toBlob(r,"image/jpeg",.86));return out||blob;}
  finally{if(bmp.close)bmp.close();}
}
async function prepImages(blob){
  const bmp=await decode(blob);if(!bmp)throw{code:"image_rejected"};
  const w=bmp.width,h=bmp.height,long=Math.max(w,h);
  const cut=(sx,sy,sw,sh)=>{const sc=Math.min(1,1568/Math.max(sw,sh));const c=document.createElement("canvas");c.width=Math.round(sw*sc);c.height=Math.round(sh*sc);
    c.getContext("2d").drawImage(bmp,sx,sy,sw,sh,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,"image/jpeg",.86));};
  try{
    if(long>=2000){
      const ov=.12;let x,y;
      if(w>=h){const pw=Math.round(w*(.5+ov/2));x=await cut(0,0,pw,h);y=await cut(w-pw,0,pw,h);}
      else{const ph=Math.round(h*(.5+ov/2));x=await cut(0,0,w,ph);y=await cut(0,h-ph,w,ph);}
      if(x&&y)return[x,y];
    }
    const one=await cut(0,0,w,h);if(!one)throw{code:"image_rejected"};return[one];
  }finally{if(bmp.close)bmp.close();}
}
async function queuePhotos(blobs){
  const recs=[];
  for(const b of blobs){const small=await shrink(b);recs.push({id:uid("p"),blob:small,addedAt:Date.now()});}
  S.queued.push(...recs);
  const ok=await store.put(recs,"photos");
  if(!ok&&S.persist)toast("Your phone is low on space for photos. They’ll stay until you close the app.");
  scheduleRender();return recs.length;
}
// Photos that have been read are kept (marked read) so they can be looked at again later.
async function keepPhotos(entries){
  const ids=new Map(),recs=[];
  for(const e of entries){
    if(e.qid){const p=S.queued.find(x=>x.id===e.qid);if(p){recs.push({...p,read:true});ids.set(e,p.id);}continue;}
    const small=await shrink(e.blob);const rec={id:uid("p"),blob:small,addedAt:Date.now(),read:true};recs.push(rec);ids.set(e,rec.id);
  }
  if(recs.length){
    const ok=await store.put(recs,"photos");
    const read=new Set(recs.map(r=>r.id));S.queued=S.queued.filter(p=>!read.has(p.id));
    if(ok)S.savedPhotos+=recs.length;
    scheduleRender();
  }
  return ids;
}
async function removeQueued(ids){
  if(!ids.length)return;
  S.queued=S.queued.filter(p=>!ids.includes(p.id));await store.del(ids,"photos");scheduleRender();
}
function isOwned(c){return live("book").some(b=>titleMatch(b.title,c.title)&&(!c.author||!b.author||lastName(b.author)===lastName(c.author)));}
function startReading(entries){

async function readPhotos(entries){
  const ctl=new AbortController();S.photoCtl=ctl;
  const found=[],errors=[],ok=[],failed=[];
  for(let i=0;i<entries.length;i++){
    if(ctl.signal.aborted)break;
    const body=$("#sheet .sheet-body");if(!body){ctl.abort();break;}
    body.innerHTML=`<h2 class="sheet-title">Reading your shelves</h2>
      <p class="progress-line">${entries.length>1?`Photo ${i+1} of ${entries.length}…`:"Reading the photo…"}</p>
      <div class="bar"><span style="width:${Math.round((i+.15)/entries.length*100)}%"></span></div>
      <p class="muted">Claude is reading each spine. A full shelf can take up to a minute.</p>
      <button class="btn wide" id="stopRead">Stop</button>`;
    $("#stopRead").onclick=()=>ctl.abort();
    try{
      const imgs=await prepImages(entries[i].blob);
      const res=await AI.json(identifyPrompt(imgs.length),{images:imgs,signal:ctl.signal});
      const arr=Array.isArray(res&&res.books)?res.books:(Array.isArray(res)?res:[]);
      for(const r of arr){const title=cleanStr(r&&r.title,200);if(!title)continue;
        found.push({title,author:cleanStr(r.author,120),translator:cleanStr(r.translator,160),publisher:cleanStr(r.publisher,80),
          color:hex(r.color),textColor:hex(r.textColor),sure:r.sure!==false,entry:entries[i]});}
      ok.push(entries[i]);
    }catch(e){
      if(e&&e.code==="cancelled")break;
      const m=sampleMsg(e);if(m)errors.push(m);failed.push(entries[i]);
      if(stopsRun(e)){for(let j=i+1;j<entries.length;j++)failed.push(entries[j]);break;}
    }
  }
  S.photoCtl=null;
  const fresh=failed.filter(e=>!e.qid);
  if(fresh.length)await queuePhotos(fresh.map(e=>e.blob));
  if(!$("#sheet"))return;
  const seen=new Map();
  for(const c of found){const k=norm(c.title)+"|"+lastName(c.author);const p=seen.get(k);if(!p||(!p.sure&&c.sure))seen.set(k,c);}
  review([...seen.values()],errors,ok,fresh.length,entries.length);
}

/* ---------- translations ---------- */
function translationPrompt(items){
  return `For each book below, say which language it was first written in, and who translated this edition if it was not written in English.
Books: ${JSON.stringify(items)}
Reply with only a JSON array, one object per book, using the same "key" values:
[{"key":"k0","originalLanguage":null,"translator":null,"translatorLikely":true}]
"originalLanguage" is null for books first written in English. For translated books: if a translator is given in the input, repeat it with "translatorLikely": false. Otherwise give the translator of this edition only when the publisher or edition makes it fairly clear, with "translatorLikely": true, and use null when you can't tell. Don't guess between several well-known translations without an edition clue.`;
}
function rescanPrompt(parts,titles){
  return `${parts>1?"These images are overlapping sections of ONE photo of a bookshelf.":"This is a photo of a bookshelf."}
Find these books on the shelf: ${JSON.stringify(titles)}
For each one, read the translator's name if it is printed on the spine or cover, and the publisher imprint if visible. Do not guess: use null for anything you cannot read.
Reply with only a JSON array: [{"title":"as given","translator":null,"publisher":null}]`;
}
const isTranslated=b=>!!b.originalLanguage;
const translatorKnown=b=>b.translator&&["spine","photo","you"].includes(b.translatorSource);
async function findTranslators(onStep){
  if(!canAsk())throw{code:AI.key()?"offline":"no_key"};
  let books=live("book").filter(b=>!b.translationChecked);
  const res={checked:0,translated:0,fromPhotos:0};
  // 1. which books are translations, plus edition-based guesses
  for(let i=0;i<books.length;i+=40){
    const batch=books.slice(i,i+40);onStep(`Checking which books are translations: ${Math.min(i+40,books.length)} of ${books.length}`);
    const arr=await AI.json(translationPrompt(batch.map((b,k)=>{const o={key:"k"+k,title:b.title,author:b.author||""};if(b.publisher)o.publisher=b.publisher;if(b.translator)o.translator=b.translator;return o;})));
    const out=[];
    for(const d of Array.isArray(arr)?arr:[]){const b=batch[parseInt(String(d&&d.key||"").slice(1),10)];if(!b)continue;
      const cur=S.records.get(b.id);if(!cur||cur.deleted)continue;const c=clone(cur);applyTranslation(c,d);out.push(c);}
    if(out.length)await save(out);res.checked+=batch.length;
  }
  // 2. look again at saved photos for translators printed on spines
  const need=live("book").filter(b=>isTranslated(b)&&!translatorKnown(b)&&b.photoId);
  const byPhoto=new Map();need.forEach(b=>{if(!byPhoto.has(b.photoId))byPhoto.set(b.photoId,[]);byPhoto.get(b.photoId).push(b);});
  if(byPhoto.size){
    const photos=new Map((await store.all("photos")).map(p=>[p.id,p]));let n=0;
    for(const[pid,list]of byPhoto){
      n++;onStep(`Looking at your saved photos again: ${n} of ${byPhoto.size}`);
      const p=photos.get(pid);if(!p||!p.blob)continue;
      const imgs=await prepImages(p.blob);
      const arr=await AI.json(rescanPrompt(imgs.length,list.map(b=>b.title)),{images:imgs});
      const out=[];
      for(const d of Array.isArray(arr)?arr:[]){const b=list.find(x=>titleMatch(x.title,d&&d.title));if(!b)continue;
        const c=clone(S.records.get(b.id));const t=cleanStr(d.translator,160);
        if(t){c.translator=t;c.translatorSource="spine";res.fromPhotos++;}
        if(!c.publisher&&cleanStr(d.publisher))c.publisher=cleanStr(d.publisher,80);
        out.push(c);}
      if(out.length)await save(out);
    }
  }
  res.translated=live("book").filter(isTranslated).length;
  res.unknown=live("book").filter(b=>isTranslated(b)&&!translatorKnown(b)).length;
  return res;
}

Reply with only JSON: {"translator":null,"publisher":null,"originalLanguage":null}
"originalLanguage" is the language the book was first written in, or null if English.`,{images:imgs,model:MODELS.smart,maxTokens:300});

/* ---------- paste from Claude ---------- */
// Accepts {"study":1,"books":[...],"lists":[...]} written by Claude in chat, or a full backup file's JSON.
async function importFromClaude(text){
  let j;try{j=parseJSON(text);}catch(e){throw new Error("That text doesn’t look like a book list from Claude. Copy the whole block and try again.");}
  if(Array.isArray(j))j={books:j};
  if(Array.isArray(j&&j.records)){
    const ok=j.records.filter(r=>r&&typeof r.id==="string"&&/^[A-Za-z0-9_\-]+$/.test(r.id)&&["book","list","series"].includes(r.kind));
    const take=ok.filter(r=>{const l=S.records.get(r.id);return!l||(r.updatedAt||0)>(l.updatedAt||0);}).map(r=>{const c=clone(r);delete c._synced;return c;});
    if(take.length)await save(take);
    return{added:take.filter(r=>r.kind==="book").length,updated:0,skipped:ok.length-take.length,listed:0};
  }
  const books=Array.isArray(j&&j.books)?j.books:[];
  const lists=Array.isArray(j&&j.lists)?j.lists:[];
  if(!books.length&&!lists.length)throw new Error("No books or lists found in that text.");
  const seriesMap=new Map(),out=[];let added=0,updated=0,skipped=0,listed=0;
  for(const d of books){
    if(!d||!cleanStr(d.title))continue;
    const existing=live("book").find(b=>titleMatch(b.title,d.title)&&(!d.author||!b.author||lastName(b.author)===lastName(d.author)));
    if(existing){
      if(existing.needsDetails||!existing.blurb){const c=clone(existing);applyDetails(c,d,seriesMap);out.push(c);updated++;}else skipped++;
      continue;
    }
    const b=newBook({title:d.title,author:d.author,color:d.color,textColor:d.textColor});
    applyDetails(b,d,seriesMap);out.push(b);added++;
  }
  if(out.length)await save([...out,...seriesMap.values()]);
  for(const l of lists){
    const name=cleanStr(l&&l.name,80);if(!name)continue;
    let list=live("list").find(x=>norm(x.name)===norm(name));
    list=list?clone(list):{kind:"list",id:uid("l"),name,items:[],createdAt:Date.now()};
    for(const it of Array.isArray(l.items)?l.items:[]){
      const t=cleanStr(it&&it.title,200);if(!t||list.items.some(i=>norm(i.title)===norm(t)))continue;
      list.items.push(cleanItem(it));listed++;
    }
    await save(list);
  }
  return{added,updated,skipped,listed};
}

}

function renderShelves(){
  const all=live("book");
  if(!all.length){
    return bookcase("Awaiting your books",null,"",{blank:true,extra:`<div class="empty-card parch"><h2>The shelves are bare</h2>
      <p>${canRead()?"Photograph a shelf and Claude will read the spines.":(AI.key()?"Type a few books in, or save shelf photos for Claude to read once you’re online.":"Send your shelf photos to Claude in chat and paste what it gives you, or type a few books in.")}</p>
      <button class="btn brass" data-act="add">Add books</button></div>`});
  }
  const q=norm(S.q);
  const books=q?all.filter(b=>norm([b.title,b.author,b.seriesName,b.genre,b.translator,b.publisher,b.originalLanguage].join(" ")).includes(q)):all;
  if(!books.length)return`<p class="empty-note">Nothing on your shelves matches “${esc(S.q)}”.</p>`;
  const sortKey=b=>[lastName(b.author),norm(b.seriesName||""),String(b.seriesNumber??0).padStart(6,"0"),norm(b.title)].join("|");
  let groups;
  if(S.group==="recent"){groups=[["Newest arrivals",[...books].sort((a,b)=>(b.addedAt||0)-(a.addedAt||0))]];}
  else{
    const m=new Map();
    for(const b of books){const k=S.group==="genre"?(b.genre||"Not yet catalogued"):((lastName(b.author)[0]||"#").toUpperCase());if(!m.has(k))m.set(k,[]);m.get(k).push(b);}
    groups=[...m.entries()];
    if(S.group==="genre")groups.sort((a,b)=>{const ia=GENRES.indexOf(a[0]),ib=GENRES.indexOf(b[0]);return(ia<0?99:ia)-(ib<0?99:ib);});
    else groups.sort((a,b)=>a[0].localeCompare(b[0]));
    groups.forEach(g=>g[1].sort((a,b)=>sortKey(a).localeCompare(sortKey(b))));
  }
  return`<p class="count">${q?`${books.length} of ${plural(all.length,"volume")}`:plural(all.length,"volume")}</p>`+
    groups.map(([label,list])=>bookcase(label,list.length,list.map(spine).join(""))).join("");
}
function renderSeries(){

  const gaps=all.reduce((n,s)=>n+s.missing.length,0);
  const shown=S.gapsOnly?all.filter(s=>s.missing.length):all;
  const listed=listItemsIndex();
  return`<div class="section-head"><p>${plural(all.length,"series","series")}, ${gaps?`${plural(gaps,"book")} missing`:"no gaps"}</p>
    <button class="chip" data-act="gapsOnly" aria-pressed="${S.gapsOnly}">Only series with gaps</button></div>`+
  (shown.length?"":`<p class="empty-note">Every series you own is complete.</p>`)+
  shown.map(s=>{
    const open=S.openSeries.has(s.sid);const owned=s.entries.filter(e=>e.book).length;
    const tag=!s.catalogued?`<span class="tag soft">List not loaded</span>`:s.missing.length?`<span class="tag gap">${s.missing.length} missing</span>`:`<span class="tag full">${s.complete===false?"Caught up":"Complete set"}</span>`;
    const sub=[s.author,s.catalogued?`you own ${owned} of ${s.entries.length}`:"",s.complete===false?"still being written":""].filter(Boolean).join(", ");
    return`<div class="ledger leather" id="ser-${s.sid}">
      <button class="card-head" data-toggle-series="${s.sid}" aria-expanded="${open}">
        <p class="card-title">${esc(s.name)}</p>
        <p class="card-sub">${esc(sub)}</p>
        <div class="progress-row"><div class="pips" aria-hidden="true">${s.entries.slice(0,40).map(e=>e.book?`<span class="pip" style="background:${colors(e.book).c}"></span>`:`<span class="pip miss"></span>`).join("")}</div>${tag}</div>
      </button>
      ${open?`<div class="card-body">${s.entries.map(e=>{
        if(e.book)return`<div class="entry"><span class="num">${e.number??""}</span><button class="link" data-book="${e.book.id}"><div class="et">${esc(e.book.title)}</div>${e.year?`<div class="ey">${esc(e.year)}</div>`:""}</button><span class="owned">on your shelf</span></div>`;
        const idx=s.missing.indexOf(e);const on=listed.get(norm(e.title));
        return`<div class="entry missing"><span class="num">${e.number??""}</span><div><div class="et">${esc(e.title)}</div>${e.year?`<div class="ey">${esc(e.year)}</div>`:""}</div>
          ${on?`<span class="tag soft">On ${esc(on)}</span>`:`<button class="btn small" data-want="${s.sid}|${idx}">Add to ${WISHLIST}</button>`}</div>`;}).join("")}
        <div class="card-foot"><button class="btn small" data-refresh-series="${s.sid}" ${S.busySeries.has(s.sid)?"disabled":""}>${S.busySeries.has(s.sid)?"Checking…":s.catalogued?"Check for newer books":"Load the full series"}</button></div>
      </div>`:""}
    </div>`;}).join("");
}
function listItemHTML(l,it){
  const kind=it.kind||"book";let status="";
  if(kind==="book"&&live("book").some(b=>titleMatch(b.title,it.title)))status=`<span class="tag ownedtag">On your shelves</span>`;
  if(kind==="series"){const sv=seriesView().find(x=>titleMatch(x.name,it.title)||norm(x.name).includes(norm(it.title)));
    if(sv)status=`<span class="tag ownedtag">You own ${sv.entries.filter(e=>e.book).length}${sv.catalogued?` of ${sv.entries.length}`:""}</span>`;}
  return`<div class="item">
    <div class="it">${esc(it.title||it.text||"")}${kind==="series"?` <span class="tag kindtag">series</span>`:""}</div>
    ${it.author?`<div class="ia">${esc(it.author)}</div>`:""}
    ${it.translator?`<div class="in">Translated by ${esc(it.translator)}</div>`:""}
    ${it.note?`<div class="in">${esc(it.note)}</div>`:""}
    <div class="ib">${status}${kind==="book"&&!status?`<button class="btn small" data-gotit="${l.id}|${it.id}">I own it now</button>`:""}<button class="btn small quiet" data-remove-item="${l.id}|${it.id}">Remove</button></div></div>`;
}
function renderLists(){
  const lists=live("list").sort((a,b)=>(a.name===WISHLIST?-1:b.name===WISHLIST?1:0)||(a.createdAt||0)-(b.createdAt||0));
  const head=`<div class="section-head"><p>${lists.length?plural(lists.length,"list"):"Anything you want to read, in any form."}</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${canAsk()?`<button class="btn small" data-act="suggest" ${S.suggesting?"disabled":""}>${S.suggesting?"Thinking…":"Suggest books for me"}</button>`:""}
    <button class="btn small brass" data-act="newList">New list</button></div></div>`;
  if(!lists.length)return head+`<p class="empty-note">No lists yet. Tap New list and paste anything: series you want to start, classics in the translations you like, recommendations from friends.</p>`;
  return head+lists.map(l=>{
    const open=S.openLists.has(l.id);const items=l.items||[];
    const series=items.filter(i=>i.kind==="series").length;
    let body="",sec=null;
    for(const it of items){if((it.section||null)!==sec){sec=it.section||null;if(sec)body+=`<p class="list-section">${esc(sec)}</p>`;}body+=listItemHTML(l,it);}
    return`<div class="index-card"><button class="card-head" data-toggle-list="${l.id}" aria-expanded="${open}">
      <p class="card-title">${esc(l.name)}</p><p class="card-sub">${plural(items.length,"item")}${series?`, ${plural(series,"series","series")}`:""}</p></button>
      ${open?`<div class="card-body">${items.length?body:`<p style="color:var(--parch-ink-2);font-style:italic">This list is empty.</p>`}
        <div class="card-foot"><button class="btn small" data-add-item="${l.id}">Add to this list</button>
        <button class="btn small quiet danger-text" data-del-list="${l.id}">${S.confirmDel===l.id?"Tap again to delete":"Delete list"}</button></div></div>`:""}
    </div>`;}).join("");
}
function render(){
  if(!S.loaded)return;
  document.querySelectorAll(".nav [data-tab]").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===S.tab?"page":"false"));
  $("#shelfTools").hidden=S.tab!=="shelves";
  $("#offline").hidden=navigator.onLine!==false;
  const body=S.tab==="shelves"?renderShelves():S.tab==="series"?renderSeries():renderLists();
  $("#main").innerHTML=banners()+body;
  const miss=seriesView().reduce((n,s)=>n+s.missing.length,0);
  const bd=$("#seriesBadge");bd.textContent=miss>99?"99+":String(miss);bd.hidden=!miss;
}

/* ---------- events ---------- */
$("#main").addEventListener("click",e=>{
  const t=e.target.closest("button,[data-book]");if(!t)return;const d=t.dataset;
  if(d.book)return openBook(d.book);
  if(d.toggleSeries){S.openSeries.has(d.toggleSeries)?S.openSeries.delete(d.toggleSeries):S.openSeries.add(d.toggleSeries);return render();}
  if(d.toggleList){S.openLists.has(d.toggleList)?S.openLists.delete(d.toggleList):S.openLists.add(d.toggleList);return render();}
  if(d.want){const[sid,idx]=d.want.split("|");const s=seriesView().find(x=>x.sid===sid);const m=s&&s.missing[+idx];
    if(m)addToList(WISHLIST,{title:m.title,author:s.author,note:`${s.name}${m.number!=null?`, book ${m.number}`:""}`});return;}
  if(d.refreshSeries)return refreshSeries(d.refreshSeries);
  if(d.addItem)return openItemSheet(d.addItem);
  if(d.gotit)return gotIt(d.gotit);
  if(d.removeItem)return removeItem(d.removeItem);
  if(d.delList)return delList(d.delList);
  if(d.act==="suggest")return suggest();
  if(d.act==="newList")return openNewList();
  if(d.act==="fill")return fillDetails(live("book").filter(b=>b.needsDetails).map(b=>b.id));
  if(d.act==="add")return openAdd();
  if(d.act==="readQueue")return startReading(S.queued.map(p=>({blob:p.blob,qid:p.id})));
  if(d.act==="typeQueue")return openTypeFromPhoto(0);
  if(d.act==="gapsOnly"){S.gapsOnly=!S.gapsOnly;return render();}
});
document.querySelectorAll(".nav [data-tab]").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render();window.scrollTo(0,0);});
$("#addBtn").onclick=openAdd;
$("#menuBtn").onclick=openMenu;
$("#q").addEventListener("input",e=>{S.q=e.target.value;render();});
$("#group").addEventListener("change",e=>{S.group=e.target.value;try{localStorage.setItem("shelves-group",S.group);}catch(_){}render();});
window.addEventListener("online",()=>{scheduleRender();if(S.queued.length&&AI.key())toast(`Back online. ${plural(S.queued.length,"photo")} ready to read.`);});
window.addEventListener("offline",scheduleRender);

(async function init(){
  try{const g=localStorage.getItem("shelves-group");if(g&&["genre","author","recent"].includes(g)){S.group=g;$("#group").value=g;}}catch(_){}
  await store.open();
  for(const r of await store.all())S.records.set(r.id,r);
  const photos=(await store.all("photos")).filter(p=>p&&p.blob);
  S.queued=photos.filter(p=>!p.read).sort((a,b)=>a.addedAt-b.addedAt);
  S.savedPhotos=photos.filter(p=>p.read).length;
  S.loaded=true;render();
  try{if(navigator.storage&&navigator.storage.persist)S.persisted=await navigator.storage.persist();}catch(_){}
  if("serviceWorker" in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
</body>
</html>
